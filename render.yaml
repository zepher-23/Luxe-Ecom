services:
  # Backend Service
  - type: web
    name: luxe-ecom-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # Set this in Render Dashboard
      - key: JWT_SECRET
        sync: false # Set this in Render Dashboard
      - key: STRIPE_SECRET_KEY
        sync: false # Set this in Render Dashboard
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false # Set this in Render Dashboard
